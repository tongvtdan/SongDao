name: songdao
description: "Sống Đạo is a local-first Catholic daily practice app for one clear action, liturgical context, reminders, and private rhythm."
publish_to: "none"
version: 0.1.1+5

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.7
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  go_router: ^14.8.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  vnlunar: 1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - ../content/packs/songdao-pack-calendar-vn-2026-0.2.0.json
    - ../content/packs/songdao-pack-parishes-vn-beta-2026-0.1.0.json
