name: songdao
description: "Sống Đạo is a local-first Catholic daily practice app for one clear action, liturgical context, reminders, and private rhythm."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.7
  drift: ^2.32.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  google_fonts: ^6.2.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - ../content/packs/songdao-pack-calendar-vn-2026-0.2.0.json
    - ../content/packs/songdao-pack-calendar-vn-demo-2026-0.1.0.json
    - ../content/packs/songdao-pack-calendar-vn-post-demo-2026-0.1.0.json
    - ../content/packs/songdao-pack-parishes-vn-beta-2026-0.1.0.json
